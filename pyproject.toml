[project]
name = "hybridguard"
version = "0.1.0"
description = "HybridGuard: hallucination-mitigated LLM smart-contract auditing via static slicing and symbolic verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "slither-analyzer>=0.10.0",
    "requests>=2.28",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hybridguard = "hybridguard.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "BLE001",   # broad exception handling is intentional at tool boundaries
    "PLW1510",  # subprocess timeout is passed explicitly where it matters
    "RUF059",
    "ISC004",
    "SIM102",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
